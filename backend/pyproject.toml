[project]
name = "mai-brain-backend"
version = "0.1.0"
description = "mAI-Brain — 도메인 특화 RAG 챗봇 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "qdrant-client>=1.11.0",
    "chardet>=5.0",
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "pytesseract>=0.3.10",
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=3.0.0",
    "kiwipiepy>=0.18.0",
    "langchain-text-splitters>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.31",
    "pytest>=9.0.3",
    "openai>=1.30.0",
    "scalar-fastapi>=1.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
ocr = [
    "surya-ocr>=0.8.0",
    "camelot-py[csv]>=0.11.0",
    "img2table>=1.2.0",
]
doc-parsers = [
    "python-docx>=1.1.0",
    "olefile>=0.47",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "readability-lxml>=0.8.0",
]
api-embedding = [
    "cohere>=5.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx",  # TestClient 용
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
